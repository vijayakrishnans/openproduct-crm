apiVersion: sourceplane.io/v1
kind: Component
metadata:
  name: crm-web-e2e
  description: Browser suite for `crm-web` — Atomic CRM's e2e specs, login adapted, driven in Chromium against a real API.
spec:
  docs:
    overview: docs/overview.md
    pages:
      - { path: docs/architecture.md, role: architecture }
      - { path: docs/runbook.md, role: runbook }
  type: turbo-package
  lifecycle: production
  owner: platform
  domain: starter-tests
  path: tests/crm-web-e2e
  subscribe:
    environments:
      - name: dev
        profile: verify
  parameters:
    nodeVersion: "22"
    pnpmVersion: "10.12.1"
    buildCommand: pnpm exec turbo run build --filter=./
    typecheckCommand: pnpm exec turbo run typecheck --filter=./
    preBuildCommand: pnpm exec turbo run test --filter=./
  labels:
    team: platform
    layer: test
