apiVersion: sourceplane.io/v1
kind: Component
metadata:
  name: crm-worker-tests
  description: Verification suite for `crm-worker` — build, typecheck and its own tests, run on every plan that includes it.
spec:
  docs:
    overview: docs/overview.md
    pages:
      - { path: docs/architecture.md, role: architecture }
      - { path: docs/runbook.md, role: runbook }
  type: turbo-package
  lifecycle: production
  owner: platform
  domain: starter-tests
  path: tests/crm-worker
  dependsOn:
    # A build input: a change to crm-worker reruns this suite under --changed.
    - component: crm-worker
      input: true
  subscribe:
    environments:
      - name: dev
        profile: verify
  parameters:
    nodeVersion: "22"
    pnpmVersion: "10.12.1"
    buildCommand: pnpm exec turbo run build --filter=./
    typecheckCommand: pnpm exec turbo run typecheck --filter=./
    preBuildCommand: pnpm exec turbo run test --filter=./
  labels:
    team: platform
    layer: test
