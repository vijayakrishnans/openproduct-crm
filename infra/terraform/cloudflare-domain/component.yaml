apiVersion: sourceplane.io/v1
kind: Component

metadata:
  name: cloudflare-domain
  description: Adopts the brokecrm.cloud Cloudflare zone and attaches the CRM web app's custom domain to each environment's crm-web Worker
  labels:
    domain: infra
    scope: dns-and-custom-domains

spec:
  docs:
    overview: docs/overview.md
    pages:
      - { path: docs/architecture.md, role: architecture }
      - { path: docs/runbook.md, role: runbook }
  type: terraform
  lifecycle: production
  owner: platform
  domain: infra

  parameters:
    orgName: sourceplane
    stackName: cloudflare-domain
    terraformDir: terraform
    terraformVersion: "1.15.3"
    baseDomain: brokecrm.cloud
    # The zone was added to the account in the dashboard (the platform does
    # not create zones), so this stack adopts it by name.
    zoneMode: existing
    workerNamePrefix: openproduct-crm-web-console-next
    crmWebWorkerNamePrefix: openproduct-crm-crm-web
    # NOTE: `CRM_WEB_CUSTOM_DOMAIN` and `CONSOLE_CUSTOM_DOMAIN` are
    # intentionally NOT declared here. They are supplied per-environment via
    # `environments.{dev,stage,prod}.parameterDefaults.terraform` in
    # `intent.yaml` (CRM_WEB_CUSTOM_DOMAIN — dev: "", stage:
    # stage.brokecrm.cloud, prod: www.brokecrm.cloud) and surfaced to
    # Terraform as `TF_VAR_<key>` by the generic `.parameters` → `TF_VAR_<key>`
    # loop in the job template. Declaring a default here would shadow the
    # parameterDefault override and resolve to '' in every environment — the
    # silent-empty failure of Task 0083 (0 added, 0 changed, 0 destroyed).
    # Both Terraform variables default to "", so absence is safe for dev.

  # The Cloudflare Terraform provider authenticates via the CLOUDFLARE_API_TOKEN
  # env var, resolved by orun from the project-rung brokered secret (fresh per
  # run), exactly as cloudflare-kv does. Declared at component level because
  # plan-only lanes look the zone up against the live Cloudflare API too.
  secretEnv:
    CLOUDFLARE_API_TOKEN: "secret://ws_9JAJMRHA/openproduct-crm/{{ .environment }}/CLOUDFLARE_API_TOKEN"
    CLOUDFLARE_ACCOUNT_ID: "secret://ws_9JAJMRHA/openproduct-crm/{{ .environment }}/CLOUDFLARE_ACCOUNT_ID"
    TF_VAR_cloudflare_account_id: "secret://ws_9JAJMRHA/openproduct-crm/{{ .environment }}/CLOUDFLARE_ACCOUNT_ID"

  # A Workers custom domain attaches to a Worker by name, so the Worker must
  # exist first.
  dependsOn:
    - component: crm-web

  subscribe:
    environments:
      - name: stage
        profile: plan-only
        profileRules:
          - profile: apply
            when:
              triggerRef: github-push-main

      - name: prod
        profile: plan-only
        profileRules:
          - profile: apply
            when:
              triggerRef: github-push-main

