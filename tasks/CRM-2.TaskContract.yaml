apiVersion: orun.io/v1
kind: TaskContract
metadata:
  name: CRM-2
  title: "CRM-A: ready to list publicly"
spec:
  goal: The public repository is ready to list as an OpenProduct.
  affects:
    - LICENSE
    - THIRD_PARTY_NOTICES.md
    - SECURITY.md
    - CONTRIBUTING.md
    - README.md
    - .gitignore
    - docs/screenshots/**
    - tasks/CRM-2.TaskContract.yaml
    - WAITING.md
    - ai/context/crm-port-ledger.md
    - specs/epics/openproduct-crm-port/IMPLEMENTATION-STATUS.md
  doneWhen:
    - LICENSE (MIT), THIRD_PARTY_NOTICES.md with Atomic CRM's MIT notice, SECURITY.md and CONTRIBUTING.md are on main
    - the README opens as a public product page with a demo link and the Atomic CRM and Lumen credits
    - .gitignore covers .env*, .dev.vars, .wrangler/ and plan.json
    - repo description, homepage and topics are set; secret scanning, push protection and main branch protection are on
  gates: []
