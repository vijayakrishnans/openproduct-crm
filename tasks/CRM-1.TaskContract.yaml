apiVersion: orun.io/v1
kind: TaskContract
metadata:
  name: CRM-1
spec:
  goal: The CRM port has its design of record, its progress ledger and its waiting list in the repository.
  affects:
    - specs/epics/openproduct-crm-port/**
    - ai/context/crm-port-ledger.md
    - WAITING.md
