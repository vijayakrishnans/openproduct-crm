apiVersion: sourceplane.io/v1
kind: Component
metadata:
  name: crm-web
  description: OpenProduct CRM web app (Vite + React, ported from Atomic CRM), delivered per environment as Workers + Static Assets
spec:
  type: cloudflare-workers-assets-turbo
  lifecycle: experimental
  owner: platform
  domain: crm
  path: apps/crm-web
  subscribe:
    environments:
      - name: dev
        profile: verify
      - name: stage
        profile: verify
        profileRules:
          - profile: deploy
            when:
              triggerRef: github-push-main
      - name: prod
        profile: verify
        profileRules:
          - profile: deploy
            when:
              triggerRef: github-push-main
  parameters:
    nodeVersion: "22"
    pnpmVersion: "10.12.1"

    workspaceDir: ../..
    appDir: .

    turboFilter: "@saas/crm-web"
    wranglerConfig: wrangler.jsonc

    # One build: the CRM on the Lumen API, and with ?demo the in-browser demo
    # (fakerest provider, fake data). The Worker only hands requests to the
    # ASSETS binding; the browser calls api-edge directly.
    workerEntrypoint: worker/index.js
    assetsDir: dist

    # openproduct-crm-crm-web-{dev,stage,prod}
    workerName: openproduct-crm-crm-web
    environmentAwareWorkerName: true
    workersDevSubdomain: vijayakrishnan12994

    installCommand: pnpm install --frozen-lockfile
    buildCommand: pnpm exec turbo run build --filter=@saas/crm-web

    # Here-strings, not `echo | grep -q`: grep exiting early on a large page
    # SIGPIPEs echo and fails the step under pipefail.
    # A just-created workers.dev script answers 404 for a few seconds, so the
    # first deploy's smoke retries on any error for about a minute.
    smokeCommand: "html=$(curl -sfL --retry 12 --retry-delay 5 --retry-all-errors \"${DEPLOYED_URL}/\") && grep -q '<title>BrokeCRM' <<< \"${html}\""
  labels:
    team: platform
    layer: delivery
    surface: crm-web
    runtime: cloudflare
